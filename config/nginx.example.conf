# Reference for the OPERATOR'S template nginx; the agent does not start this.
# Adapt the upstream port/paths to the actual template. Keep secrets out of nginx.
worker_processes auto;
pid run/nginx.pid;
error_log logs/nginx-error.log warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path run/client-body;
    proxy_temp_path run/proxy;
    server {
        listen 8080;
        server_name _;
        client_max_body_size 10m;
        location /v1/ {
            # No trailing URI: preserve the /v1/... request path.
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }
        location / { return 404; }
    }
}
