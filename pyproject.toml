[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucloud-vllm-agent"
version = "0.1.5"
description = "UCloud model hosting through explicit templates or reviewed bootstrap specifications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE.md", "LICENSES/*.txt"]
dependencies = []

[project.optional-dependencies]
ucloud = ["ucloud-workflow @ git+https://github.com/CBS-HPC/ucloud-api.git@v0.1.7", "websocket-client==1.9.2"]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
vllm-agent = "ucloud_vllm_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ucloud_vllm_agent = ["data/*.json", "data/ucloud-workspace/*", "data/ucloud-workspace/.env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
