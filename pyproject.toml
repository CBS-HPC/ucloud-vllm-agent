[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucloud-vllm-agent"
version = "0.1.2"
description = "Template-based UCloud model hosting workspace and deployment planner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ucloud = ["ucloud-workflow @ git+https://github.com/CBS-HPC/ucloud-api.git@v0.1.6", "websocket-client==1.9.2"]
dev = ["pytest>=8"]

[project.scripts]
vllm-agent = "ucloud_vllm_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ucloud_vllm_agent = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
