name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,ucloud]'
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/smoke_wheel.py
      - name: Validate generic nginx syntax (Ubuntu package, not the UCloud image)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          nginx -t -c "$PWD/src/ucloud_vllm_agent/data/ucloud-workspace/nginx.conf"
