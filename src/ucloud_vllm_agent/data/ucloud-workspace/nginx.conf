# Full config loaded by the UCloud nginx application's configuration-file field.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
    worker_connections 1024;
}
http {
    # Avoid recording query strings, client addresses or inference payloads here.
    access_log off;
    server_tokens off;
    server {
        listen 8080;
        server_name _;
        client_max_body_size 16m;
        location /v1/ {
            # No URI suffix: preserve /v1/ for chat and the PII task adapter.
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
        location / {
            return 404;
        }
    }
}
